<div class="chunk-content">
            <p class="p0">
               A service station use:
               
               <p class="incr1">
                  (1)
                  </p>
               		
               <p class="content2">
                  must be screened from the street by a building or a landscape buffer that includes
                  shade trees;
                  </p>
               		
               
               <p class="incr1">
                  (2)
                  </p>
               		
               <p class="content2">
                  may not have more than 16 fuel dispensers; and
                  </p>
               		
               
               <p class="incr1">
                  (3)
                  </p>
               		
               <p class="content2">
                  may not have more than eight vehicle queue lanes.
                  </p>
               		
               
            <p class="historynote0">
               Source: Ord. 20060831-068; Ord. 20110804-008.
               </p></div>
