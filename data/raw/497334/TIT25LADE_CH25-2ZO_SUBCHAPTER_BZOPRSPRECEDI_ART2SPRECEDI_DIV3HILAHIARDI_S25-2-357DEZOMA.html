<div class="chunk-content">
            <p class="p0">
               The director of the Neighborhood Planning and Zoning Department shall add as a suffix
               to the base district designation on the zoning map:
               
               <p class="incr1">
                  (1)
                  </p>
               		
               <p class="content2">
                  the letter "H" to reflect a historic landmark designation; or
                  </p>
               		
               
               <p class="incr1">
                  (2)
                  </p>
               		
               <p class="content2">
                  the letters "HD" to reflect a historic area designation.
                  </p>
               		
               
            <p class="historynote0">
               Source: Ord. 041202-16.
               </p></div>
