<div class="chunk-content">
            <p class="p0">
               An accessory use is a use that:
               
               <p class="incr1">
                  (1)
                  </p>
               		
               <p class="content2">
                  is incidental to and customarily associated with a principal use;
                  </p>
               		
               
               <p class="incr1">
                  (2)
                  </p>
               		
               <p class="content2">
                  unless otherwise provided, is located on the same site as the principal use; and
                  </p>
               		
               
               <p class="incr1">
                  (3)
                  </p>
               		
               <p class="content2">
                  may include parking for the principal use.
                  </p>
               		
               
            <p class="historynote0">
               Source: Section 13-2-1; Ord. 990225-70; Ord. 031211-11.
               </p></div>
